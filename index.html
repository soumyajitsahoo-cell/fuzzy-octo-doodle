<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>New Tab</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['-apple-system', 'BlinkMacSystemFont', '"SF Pro Display"', '"SF Pro Text"', 'Inter', 'system-ui', 'sans-serif'],
            mono: ['"SF Mono"', '"JetBrains Mono"', 'Menlo', 'monospace']
          },
          colors: {
            surface: {
              light: '#ffffff',
              dark: '#121215',
              subtleLight: '#f4f4f6',
              subtleDark: '#18181c'
            }
          }
        }
      }
    }
  </script>
  <style>
    *, *::before, *::after {
      -webkit-user-select: none;
      -moz-user-select: none;
      -ms-user-select: none;
      user-select: none;
      box-sizing: border-box;
    }

    input, textarea, [contenteditable="true"] {
      -webkit-user-select: text;
      -moz-user-select: text;
      -ms-user-select: text;
      user-select: text;
    }

    img, svg {
      -webkit-user-drag: none;
      user-drag: none;
    }

    .tabular-nums {
      font-variant-numeric: tabular-nums;
    }

    ::-webkit-scrollbar {
      width: 5px;
      height: 5px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(156, 163, 175, 0.25);
      border-radius: 9999px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: rgba(156, 163, 175, 0.45);
    }

    button:active {
      transform: scale(0.96);
      transition: transform 0.1s ease-out;
    }

    .smooth-transition {
      transition: opacity 0.22s cubic-bezier(0.16, 1, 0.3, 1), transform 0.22s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .liquid-bg-blob {
      position: fixed;
      border-radius: 9999px;
      filter: blur(90px);
      pointer-events: none;
      z-index: 0;
      opacity: 0.35;
      animation: float-blob 22s ease-in-out infinite alternate;
      will-change: transform;
    }
    .dark .liquid-bg-blob {
      opacity: 0.28;
      filter: blur(100px);
    }
    .liquid-bg-blob-1 {
      width: 540px;
      height: 540px;
      background: radial-gradient(circle, rgba(56, 189, 248, 0.45) 0%, rgba(168, 85, 247, 0.25) 50%, transparent 80%);
      top: -10%;
      left: 15%;
      animation-duration: 20s;
    }
    .liquid-bg-blob-2 {
      width: 480px;
      height: 480px;
      background: radial-gradient(circle, rgba(244, 114, 182, 0.4) 0%, rgba(251, 191, 36, 0.25) 55%, transparent 80%);
      bottom: -10%;
      right: 12%;
      animation-duration: 26s;
      animation-delay: -6s;
    }
    .liquid-bg-blob-3 {
      width: 420px;
      height: 420px;
      background: radial-gradient(circle, rgba(16, 185, 129, 0.35) 0%, rgba(56, 189, 248, 0.25) 60%, transparent 80%);
      top: 40%;
      left: 45%;
      animation-duration: 24s;
      animation-delay: -11s;
    }

    @keyframes float-blob {
      0% { transform: translate3d(0, 0, 0) scale(1) rotate(0deg); }
      50% { transform: translate3d(50px, -35px, 0) scale(1.12) rotate(180deg); }
      100% { transform: translate3d(-35px, 45px, 0) scale(0.94) rotate(360deg); }
    }

    .bg-great-wave {
      position: fixed;
      inset: 0;
      background-image: url('background.jpg');
      background-size: cover;
      background-position: center 60%;
      background-repeat: no-repeat;
      z-index: 0;
      transform: scale(1.02);
      transition: filter 0.5s ease;
    }

    .bg-overlay {
      position: fixed;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      background: linear-gradient(180deg, 
        rgba(10, 16, 28, 0.38) 0%, 
        rgba(10, 16, 28, 0.2) 35%, 
        rgba(8, 12, 22, 0.6) 100%);
    }

    .dark .bg-overlay {
      background: linear-gradient(180deg, 
        rgba(6, 10, 18, 0.5) 0%, 
        rgba(6, 10, 18, 0.28) 35%, 
        rgba(4, 7, 14, 0.76) 100%);
    }

    .liquid-glass {
      position: relative;
      background: linear-gradient(135deg, rgba(250, 250, 252, 0.42) 0%, rgba(245, 245, 247, 0.28) 100%);
      backdrop-filter: blur(8px) saturate(150%) brightness(102%);
      -webkit-backdrop-filter: blur(8px) saturate(150%) brightness(102%);
      border: 1px solid rgba(255, 255, 255, 0.60);
      box-shadow: 
        0 4px 16px -2px rgba(0, 0, 0, 0.12),
        0 1px 4px 0 rgba(0, 0, 0, 0.06),
        inset 0 1px 1px 0 rgba(255, 255, 255, 0.90),
        inset 0 -1px 1px 0 rgba(0, 0, 0, 0.08);
      overflow: hidden;
      transition: box-shadow 0.22s cubic-bezier(0.16, 1, 0.3, 1), border-color 0.2s ease;
    }

    .dark .liquid-glass {
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.15) 0%, rgba(255, 255, 255, 0.07) 50%, rgba(255, 255, 255, 0.13) 100%);
      backdrop-filter: blur(8px) saturate(170%) brightness(106%);
      -webkit-backdrop-filter: blur(8px) saturate(170%) brightness(106%);
      border: 1px solid rgba(255, 255, 255, 0.18);
      box-shadow: 
        0 8px 24px -2px rgba(0, 0, 0, 0.35),
        0 2px 6px 0 rgba(0, 0, 0, 0.20),
        inset 0 1.2px 1px 0 rgba(255, 255, 255, 0.40),
        inset 0 -1px 1px 0 rgba(0, 0, 0, 0.35),
        inset 1px 0 1px 0 rgba(255, 255, 255, 0.18),
        inset -1px 0 1px 0 rgba(255, 255, 255, 0.08);
    }

    .liquid-glass::before {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: inherit;
      padding: 1px;
      background: linear-gradient(135deg, 
        rgba(255, 255, 255, 0.85) 0%, 
        rgba(255, 255, 255, 0.35) 20%, 
        rgba(56, 189, 248, 0.35) 45%, 
        rgba(236, 72, 153, 0.25) 75%, 
        rgba(255, 255, 255, 0.6) 100%);
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      pointer-events: none;
      z-index: 1;
      opacity: 0.85;
      transition: opacity 0.25s ease;
    }

    .dark .liquid-glass::before {
      background: linear-gradient(135deg, 
        rgba(255, 255, 255, 0.45) 0%, 
        rgba(255, 255, 255, 0.18) 25%, 
        rgba(56, 189, 248, 0.3) 50%, 
        rgba(236, 72, 153, 0.22) 75%, 
        rgba(255, 255, 255, 0.2) 100%);
      opacity: 0.9;
    }

    .liquid-glass::after {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: inherit;
      background: radial-gradient(300px circle at var(--mouse-x, 50%) var(--mouse-y, 50%), rgba(255, 255, 255, 0.28), rgba(255, 255, 255, 0.05) 45%, transparent 75%);
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.2s ease;
      z-index: 1;
    }

    .dark .liquid-glass::after {
      background: radial-gradient(300px circle at var(--mouse-x, 50%) var(--mouse-y, 50%), rgba(255, 255, 255, 0.18), rgba(56, 189, 248, 0.08) 45%, transparent 75%);
    }

    @media (hover: hover) and (pointer: fine) {
      .liquid-glass:hover::after {
        opacity: 1;
      }
    }

    .tile-hover {
      transition: transform 0.18s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.22s cubic-bezier(0.16, 1, 0.3, 1), border-color 0.2s ease;
    }

    @media (hover: hover) and (pointer: fine) {
      .tile-hover:hover {
        transform: translateY(-2px);
        box-shadow: 
          0 20px 42px -10px rgba(0, 0, 0, 0.35),
          0 8px 18px -4px rgba(0, 0, 0, 0.18),
          inset 0 1.5px 1px 0 rgba(255, 255, 255, 0.95);
      }
      .dark .tile-hover:hover {
        box-shadow: 
          0 28px 56px -12px rgba(0, 0, 0, 0.8),
          0 12px 26px -5px rgba(0, 0, 0, 0.45),
          inset 0 1.5px 1.5px 0 rgba(255, 255, 255, 0.45);
      }
    }

    .tile-hover:active {
      transform: scale(0.96);
    }

    .search-focus {
      transition: border-color 0.2s ease, box-shadow 0.22s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .search-focus:focus-within {
      border-color: rgba(56, 189, 248, 0.45);
      box-shadow: 
        0 24px 60px -10px rgba(0, 0, 0, 0.45),
        0 0 0 1px rgba(56, 189, 248, 0.35),
        inset 0 1.5px 1.5px 0 rgba(255, 255, 255, 0.8);
    }
    .dark .search-focus:focus-within {
      border-color: rgba(56, 189, 248, 0.4);
      box-shadow: 
        0 30px 70px -12px rgba(0, 0, 0, 0.85),
        0 0 0 1px rgba(56, 189, 248, 0.35),
        inset 0 1.5px 1.5px 0 rgba(255, 255, 255, 0.45);
    }

    .modal-backdrop {
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.18s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .modal-backdrop.is-open {
      opacity: 1;
      pointer-events: auto;
    }
    .modal-card {
      transform: scale(0.96);
      opacity: 0;
      transition: transform 0.18s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.18s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .modal-backdrop.is-open .modal-card {
      transform: scale(1);
      opacity: 1;
    }

    @media (prefers-reduced-motion: reduce) {
      .liquid-bg-blob {
        animation: none !important;
      }
      .liquid-glass, .tile-hover, .smooth-transition, button, .modal-backdrop, .modal-card {
        transition: none !important;
        transform: none !important;
      }
    }
  </style>
</head>
<body class="bg-zinc-950 text-zinc-800 dark:text-zinc-100 min-h-screen flex flex-col justify-between p-4 sm:p-8 font-sans antialiased overflow-x-hidden relative">

  <div class="bg-great-wave"></div>
  <div class="bg-overlay"></div>
  <div class="fixed inset-0 overflow-hidden pointer-events-none z-[1] opacity-60">
    <div class="liquid-bg-blob liquid-bg-blob-1"></div>
    <div class="liquid-bg-blob liquid-bg-blob-2"></div>
    <div class="liquid-bg-blob liquid-bg-blob-3"></div>
  </div>

  <main class="w-full max-w-5xl mx-auto my-auto flex flex-col items-center justify-center py-6 sm:py-10 relative z-10">

    <div class="flex flex-col items-center mb-6 sm:mb-8 text-center select-none">
      <div id="hero-clock" class="text-6xl sm:text-7xl lg:text-8xl font-light tracking-tight tabular-nums text-white drop-shadow-[0_4px_24px_rgba(0,0,0,0.7)] cursor-pointer select-none" title="Click to toggle 12/24-hour format">
        00:00
      </div>
      <div id="hero-date" class="text-sm sm:text-base font-medium text-zinc-100 dark:text-zinc-200 mt-1.5 tracking-normal drop-shadow-[0_2px_10px_rgba(0,0,0,0.7)]">
        Loading date...
      </div>
    </div>

    <div class="w-full max-w-2xl px-2 mb-8 sm:mb-10 relative">
      <form id="search-form" class="relative flex items-center group liquid-glass search-focus rounded-2xl p-0.5">
        <button type="button" id="btn-engine-pill" class="absolute left-3 z-10 flex items-center gap-1.5 px-2.5 py-1.5 rounded-xl text-xs font-medium bg-zinc-100 hover:bg-zinc-200 dark:bg-zinc-800 dark:hover:bg-zinc-700 text-zinc-700 dark:text-zinc-300 transition shadow-sm border border-zinc-200/60 dark:border-zinc-700/60" title="Click or press Tab in search bar to cycle search engines">
          <div id="engine-icon-container" class="w-4 h-4 flex items-center justify-center"></div>
          <span id="engine-name" class="hidden sm:inline font-medium text-[11px]">Google</span>
          <svg class="w-2.5 h-2.5 opacity-50" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7"/></svg>
        </button>

        <input 
          id="search-input" 
          type="text" 
          autocomplete="off" 
          spellcheck="false" 
          placeholder="Search with Google or type a URL..." 
          class="w-full pl-28 sm:pl-32 pr-12 py-3.5 sm:py-4 rounded-2xl bg-transparent border-0 outline-none text-sm sm:text-base text-zinc-900 dark:text-white font-medium placeholder-zinc-500 dark:placeholder-zinc-400 relative z-10"
        />

        <div class="absolute right-3.5 flex items-center gap-1.5 z-10">
          <button type="button" id="btn-clear-search" class="hidden text-zinc-400 hover:text-zinc-600 dark:hover:text-zinc-200 p-1" title="Clear search">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/></svg>
          </button>
          <span class="hidden sm:flex items-center justify-center w-6 h-6 rounded-md bg-zinc-100 dark:bg-zinc-800/80 text-[11px] font-mono text-zinc-400 dark:text-zinc-500 border border-zinc-200 dark:border-zinc-700/60" title="Press / to search">/</span>
        </div>
      </form>

      <div id="search-suggestions" class="hidden absolute top-full left-2 right-2 mt-2 liquid-glass rounded-2xl shadow-2xl overflow-hidden z-40 divide-y divide-zinc-200/50 dark:divide-zinc-800/50">
        <div id="suggestions-list" class="max-h-64 overflow-y-auto p-1.5 space-y-0.5"></div>
      </div>
    </div>

    <div class="w-full max-w-3xl px-2">
      <div id="shortcuts-grid" class="grid grid-cols-4 sm:grid-cols-4 md:grid-cols-8 gap-2.5 sm:gap-3.5"></div>
    </div>

  </main>

  <footer id="bottom-widgets" class="w-full max-w-5xl mx-auto pt-4 sm:pt-6 border-t border-white/20 dark:border-white/10 smooth-transition relative z-10">
    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">

      <section class="rounded-2xl liquid-glass p-4 flex flex-col justify-between min-h-[148px] relative group z-10">
        <div class="flex items-center justify-between">
          <div class="flex items-center gap-2">
            <span class="text-xs font-semibold text-zinc-700 dark:text-zinc-300 uppercase tracking-wider">Weather</span>
            <span id="weather-location-label" class="text-xs text-zinc-600 dark:text-zinc-400 font-medium truncate max-w-[140px]">Detecting...</span>
          </div>
          <button type="button" id="btn-edit-location" class="opacity-0 group-hover:opacity-100 transition p-1 text-zinc-400 hover:text-zinc-700 dark:hover:text-zinc-200 text-[11px]" title="Change city">
            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"/></svg>
          </button>
        </div>

        <div class="flex items-center justify-between my-2">
          <div class="flex items-baseline gap-1.5">
            <span id="weather-temp" class="text-3xl font-light text-zinc-900 dark:text-white tabular-nums">--°</span>
            <span id="weather-condition" class="text-xs font-medium text-zinc-700 dark:text-zinc-300">Loading...</span>
          </div>
          <div id="weather-icon-container" class="w-10 h-10 flex items-center justify-center text-zinc-700 dark:text-zinc-200">
            <svg class="w-8 h-8 animate-pulse text-zinc-400" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"/></svg>
          </div>
        </div>

        <div class="flex items-center justify-between text-[11px] text-zinc-700 dark:text-zinc-300 pt-2 border-t border-zinc-200/50 dark:border-zinc-700/50 font-mono font-medium">
          <span id="weather-range">H: --° L: --°</span>
          <span id="weather-humidity">Humidity: --%</span>
        </div>
      </section>

      <section class="rounded-2xl liquid-glass p-4 flex flex-col justify-between min-h-[148px] z-10">
        <div class="flex items-center justify-between pb-1 border-b border-zinc-100 dark:border-zinc-800/60">
          <span class="text-xs font-semibold text-zinc-700 dark:text-zinc-300 uppercase tracking-wider">Reading List</span>
          <button type="button" id="btn-add-reading-link" class="text-xs font-semibold text-zinc-700 hover:text-zinc-900 dark:text-zinc-300 dark:hover:text-white transition flex items-center gap-1" title="Add a link to read later">
            <svg class="w-3 h-3" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"/></svg>
            <span>Add</span>
          </button>
        </div>

        <div id="reading-list-container" class="my-2 space-y-1.5 max-h-[78px] overflow-y-auto pr-1"></div>

        <div class="text-[10px] text-zinc-600 dark:text-zinc-400 flex items-center justify-between font-mono font-medium">
          <span id="reading-list-count">0 items saved</span>
          <span>Click to open</span>
        </div>
      </section>

    </div>
  </footer>

  <div id="cmd-modal" class="modal-backdrop fixed inset-0 z-50 bg-black/60 dark:bg-black/75 backdrop-blur-sm flex items-start justify-center pt-20 sm:pt-28 p-4">
    <div class="modal-card w-full max-w-xl liquid-glass rounded-2xl shadow-2xl overflow-hidden">
      <div class="p-3.5 border-b border-zinc-200 dark:border-zinc-800 flex items-center gap-3">
        <svg class="w-4 h-4 text-zinc-400" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
        <input 
          id="cmd-input" 
          type="text" 
          autocomplete="off" 
          spellcheck="false" 
          placeholder="Type a command, site, or math (e.g. 144 * 12)..." 
          class="w-full bg-transparent text-sm sm:text-base text-zinc-900 dark:text-white font-medium placeholder-zinc-400 outline-none"
        />
        <kbd class="px-2 py-0.5 text-[10px] font-mono text-zinc-400 bg-zinc-100 dark:bg-zinc-800 rounded border border-zinc-200 dark:border-zinc-700">ESC</kbd>
      </div>

      <div id="cmd-calc-card" class="hidden px-4 py-2.5 bg-blue-50/60 dark:bg-blue-950/20 border-b border-blue-100 dark:border-blue-900/40 flex items-center justify-between text-xs">
        <span class="text-blue-600 dark:text-blue-400 font-medium">Calculation Result</span>
        <span id="cmd-calc-val" class="font-mono font-semibold text-sm text-zinc-900 dark:text-white font-medium">0</span>
      </div>

      <div id="cmd-list" class="max-h-72 overflow-y-auto p-2 space-y-1 text-xs"></div>

      <div class="px-4 py-2 bg-zinc-50 dark:bg-zinc-900/40 border-t border-zinc-200 dark:border-zinc-800 flex items-center justify-between text-[11px] text-zinc-400 font-mono">
        <span>Navigation: Arrow keys, Enter</span>
        <span>Esc to close</span>
      </div>
    </div>
  </div>

  <div id="shortcut-modal" class="modal-backdrop fixed inset-0 z-50 bg-black/60 dark:bg-black/75 backdrop-blur-sm flex items-center justify-center p-4">
    <div class="modal-card w-full max-w-sm liquid-glass rounded-2xl p-5 shadow-2xl space-y-4">
      <div class="flex items-center justify-between">
        <h3 id="shortcut-modal-title" class="text-sm font-semibold text-zinc-900 dark:text-white font-medium">Add Shortcut</h3>
        <button type="button" id="btn-close-shortcut-modal" class="text-zinc-400 hover:text-zinc-600 dark:hover:text-zinc-200 p-1">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/></svg>
        </button>
      </div>
      <div class="space-y-3 text-xs">
        <div>
          <label class="block text-zinc-500 mb-1 font-medium">Name</label>
          <input id="shortcut-name-input" type="text" placeholder="e.g. GitHub" class="w-full px-3 py-2 rounded-xl bg-zinc-50 dark:bg-zinc-900 border border-zinc-200 dark:border-zinc-800 text-zinc-900 dark:text-white font-medium outline-none focus:border-zinc-400 dark:focus:border-zinc-600" />
        </div>
        <div>
          <label class="block text-zinc-500 mb-1 font-medium">URL</label>
          <input id="shortcut-url-input" type="text" placeholder="https://example.com" class="w-full px-3 py-2 rounded-xl bg-zinc-50 dark:bg-zinc-900 border border-zinc-200 dark:border-zinc-800 text-zinc-900 dark:text-white font-medium outline-none focus:border-zinc-400 dark:focus:border-zinc-600" />
        </div>
      </div>
      <div class="flex items-center justify-end gap-2 pt-2">
        <button type="button" id="btn-cancel-shortcut" class="px-3 py-1.5 rounded-xl border border-zinc-200 dark:border-zinc-800 text-xs font-medium text-zinc-600 dark:text-zinc-400 hover:bg-zinc-100 dark:hover:bg-zinc-800 transition">Cancel</button>
        <button type="button" id="btn-save-shortcut" class="px-4 py-1.5 rounded-xl bg-zinc-900 dark:bg-zinc-100 text-white dark:text-zinc-900 text-xs font-medium hover:bg-zinc-800 dark:hover:bg-white transition">Save</button>
      </div>
    </div>
  </div>

  <div id="reading-modal" class="modal-backdrop fixed inset-0 z-50 bg-black/60 dark:bg-black/75 backdrop-blur-sm flex items-center justify-center p-4">
    <div class="modal-card w-full max-w-sm liquid-glass rounded-2xl p-5 shadow-2xl space-y-4">
      <div class="flex items-center justify-between">
        <h3 class="text-sm font-semibold text-zinc-900 dark:text-white font-medium">Add to Reading List</h3>
        <button type="button" id="btn-close-reading-modal" class="text-zinc-400 hover:text-zinc-600 dark:hover:text-zinc-200 p-1">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/></svg>
        </button>
      </div>
      <div class="space-y-3 text-xs">
        <div>

      </div>

  <script>
    function getDomain(url) {
      try {
        const full = /^(https?:\/\/)/i.test(url) ? url : `https://${url}`;
        return new URL(full).hostname;
      } catch (e) {
        return url.replace(/^(https?:\/\/)?(www\.)?/i, '').split('/')[0].split(':')[0];
      }
    }

    function getFaviconUrl(url) {
      const d = getDomain(url);
      return `https://www.google.com/s2/favicons?domain=${d}&sz=64`;
    }

    const DEFAULT_SHORTCUTS = [
      { id: '1', name: 'GitHub', url: 'https://github.com' },
      { id: '2', name: 'YouTube', url: 'https://youtube.com' },
      { id: '3', name: 'Reddit', url: 'https://reddit.com' },
      { id: '4', name: 'ChatGPT', url: 'https://chatgpt.com' },
      { id: '5', name: 'Claude', url: 'https://claude.ai' },
      { id: '6', name: 'X', url: 'https://x.com' },
      { id: '7', name: 'Notion', url: 'https://notion.so' },
      { id: '8', name: 'Figma', url: 'https://figma.com' }
    ];

    const SEARCH_ENGINES = [
      { id: 'google', name: 'Google', domain: 'google.com', url: 'https://www.google.com/search?q=' },
      { id: 'perplexity', name: 'Perplexity', domain: 'perplexity.ai', url: 'https://www.perplexity.ai/search?q=' },
      { id: 'duckduckgo', name: 'DuckDuckGo', domain: 'duckduckgo.com', url: 'https://duckduckgo.com/?q=' },
      { id: 'github', name: 'GitHub', domain: 'github.com', url: 'https://github.com/search?q=' },
      { id: 'youtube', name: 'YouTube', domain: 'youtube.com', url: 'https://www.youtube.com/results?search_query=' }
    ];

    const state = {
      theme: localStorage.getItem('newtab_theme') || 'dark',
      focusMode: localStorage.getItem('newtab_focus_mode') === 'true',
      is24Hour: localStorage.getItem('newtab_24hour') === 'true',
      searchEngineIndex: Number(localStorage.getItem('newtab_engine_idx')) || 0,
      shortcuts: JSON.parse(localStorage.getItem('newtab_shortcuts') || 'null') || DEFAULT_SHORTCUTS,
      readingList: JSON.parse(localStorage.getItem('newtab_reading_list') || 'null') || [
        { id: 'r1', title: 'Interface Craft & Motion - Emil Kowalski', url: 'https://emilkowal.ski', date: Date.now() - 3600000 * 24 }
      ],
      weatherLat: Number(localStorage.getItem('newtab_weather_lat')) || 20.2724,
      weatherLon: Number(localStorage.getItem('newtab_weather_lon')) || 85.8338,
      weatherCity: localStorage.getItem('newtab_weather_city') || 'Bhubaneswar',
      weatherData: JSON.parse(localStorage.getItem('newtab_weather_cache') || 'null')
    };

    let editingShortcutId = null;

    const heroClock = document.getElementById('hero-clock');
    const heroDate = document.getElementById('hero-date');

    const searchForm = document.getElementById('search-form');
    const searchInput = document.getElementById('search-input');
    const btnEnginePill = document.getElementById('btn-engine-pill');
    const engineIconContainer = document.getElementById('engine-icon-container');
    const engineName = document.getElementById('engine-name');
    const btnClearSearch = document.getElementById('btn-clear-search');
    const shortcutsGrid = document.getElementById('shortcuts-grid');
    const bottomWidgets = document.getElementById('bottom-widgets');

    const weatherLocationLabel = document.getElementById('weather-location-label');
    const weatherTemp = document.getElementById('weather-temp');
    const weatherCondition = document.getElementById('weather-condition');
    const weatherIconContainer = document.getElementById('weather-icon-container');
    const weatherRange = document.getElementById('weather-range');
    const weatherHumidity = document.getElementById('weather-humidity');
    const btnEditLocation = document.getElementById('btn-edit-location');

    const readingListContainer = document.getElementById('reading-list-container');
    const readingListCount = document.getElementById('reading-list-count');
    const btnAddReadingLink = document.getElementById('btn-add-reading-link');

    const cmdModal = document.getElementById('cmd-modal');
    const cmdInput = document.getElementById('cmd-input');
    const cmdList = document.getElementById('cmd-list');
    const cmdCalcCard = document.getElementById('cmd-calc-card');
    const cmdCalcVal = document.getElementById('cmd-calc-val');

    const shortcutModal = document.getElementById('shortcut-modal');
    const shortcutModalTitle = document.getElementById('shortcut-modal-title');
    const shortcutNameInput = document.getElementById('shortcut-name-input');
    const shortcutUrlInput = document.getElementById('shortcut-url-input');
    const btnSaveShortcut = document.getElementById('btn-save-shortcut');
    const btnCancelShortcut = document.getElementById('btn-cancel-shortcut');
    const btnCloseShortcutModal = document.getElementById('btn-close-shortcut-modal');

    const readingModal = document.getElementById('reading-modal');
    const readingTitleInput = document.getElementById('reading-title-input');
    const readingUrlInput = document.getElementById('reading-url-input');
    const btnSaveReading = document.getElementById('btn-save-reading');
    const btnCancelReading = document.getElementById('btn-cancel-reading');
    const btnCloseReadingModal = document.getElementById('btn-close-reading-modal');

    const cityModal = document.getElementById('city-modal');
    const citySearchInput = document.getElementById('city-search-input');
    const citySearchResults = document.getElementById('city-search-results');
    const btnCloseCityModal = document.getElementById('btn-close-city-modal');
    const btnCancelCity = document.getElementById('btn-cancel-city');
    const btnUseAutoGps = document.getElementById('btn-use-auto-gps');

    function applyTheme(theme) {
      state.theme = theme;
      localStorage.setItem('newtab_theme', theme);
      if (theme === 'dark') {
        document.documentElement.classList.add('dark');
      } else {
        document.documentElement.classList.remove('dark');
      }
    }

    function toggleTheme() {
      applyTheme(state.theme === 'dark' ? 'light' : 'dark');
    }

    function setFocusMode(enabled) {
      state.focusMode = enabled;
      localStorage.setItem('newtab_focus_mode', enabled);
      if (enabled) {
        bottomWidgets.classList.add('opacity-0', 'pointer-events-none', 'translate-y-4');
      } else {
        bottomWidgets.classList.remove('opacity-0', 'pointer-events-none', 'translate-y-4');
      }
    }

    function updateClock() {
      const now = new Date();
      const hours = now.getHours();
      const minutes = String(now.getMinutes()).padStart(2, '0');
      let timeText = '';
      if (state.is24Hour) {
        timeText = `${String(hours).padStart(2, '0')}:${minutes}`;
      } else {
        const displayHours = hours % 12 || 12;
        timeText = `${displayHours}:${minutes}`;
      }
      heroClock.textContent = timeText;
      const dateOptions = { weekday: 'long', month: 'long', day: 'numeric' };
      heroDate.textContent = now.toLocaleDateString(undefined, dateOptions);
    }

    heroClock.addEventListener('click', () => {
      state.is24Hour = !state.is24Hour;
      localStorage.setItem('newtab_24hour', state.is24Hour);
      updateClock();
    });

    setInterval(updateClock, 1000);
    updateClock();

    const searchSuggestionsDropdown = document.getElementById('search-suggestions');
    const suggestionsList = document.getElementById('suggestions-list');
    let activeSuggestionIdx = -1;
    let currentSuggestions = [];
    let suggestScript = null;
    let suggestCallbackName = null;

    function fetchSearchSuggestions(q) {
      const trimmed = q.trim();
      if (!trimmed) {
        hideSuggestions();
        return;
      }
      if (suggestScript && suggestScript.parentNode) {
        suggestScript.parentNode.removeChild(suggestScript);
      }
      const cbName = 'suggestCb_' + Math.floor(Math.random() * 1000000);
      suggestCallbackName = cbName;
      window[cbName] = function(data) {
        if (cbName !== suggestCallbackName) return;
        delete window[cbName];
        if (suggestScript && suggestScript.parentNode) {
          suggestScript.parentNode.removeChild(suggestScript);
        }
        if (data && Array.isArray(data[1]) && data[1].length > 0) {
          renderSearchSuggestions(data[1].slice(0, 7), trimmed);
        } else {
          hideSuggestions();
        }
      };
      const script = document.createElement('script');
      script.src = `https://suggestqueries.google.com/complete/search?client=chrome&q=${encodeURIComponent(trimmed)}&callback=${cbName}`;
      script.onerror = () => {
        delete window[cbName];
        if (script.parentNode) script.parentNode.removeChild(script);
      };
      suggestScript = script;
      document.body.appendChild(script);
    }

    function renderSearchSuggestions(items, originalQuery) {
      currentSuggestions = items;
      activeSuggestionIdx = -1;
      suggestionsList.innerHTML = '';
      items.forEach((itemText, idx) => {
        const item = document.createElement('div');
        item.className = 'suggestion-item px-3 py-2 rounded-xl text-xs sm:text-sm text-zinc-800 dark:text-zinc-200 hover:bg-zinc-100 dark:hover:bg-zinc-800/80 cursor-pointer flex items-center justify-between transition group';
        item.innerHTML = `
          <div class="flex items-center gap-2.5 truncate">
            <svg class="w-3.5 h-3.5 text-zinc-400 group-hover:text-zinc-600 dark:group-hover:text-zinc-200 transition" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
            <span class="truncate">${itemText}</span>
          </div>
          <span class="text-[10px] font-mono text-zinc-400 opacity-0 group-hover:opacity-100 transition"><svg class="w-3 h-3" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M14 5l7 7m0 0l-7 7m7-7H3"/></svg></span>
        `;
        item.addEventListener('click', () => {
          searchInput.value = itemText;
          hideSuggestions();
          executeSearch(itemText);
        });
        suggestionsList.appendChild(item);
      });
      searchSuggestionsDropdown.classList.remove('hidden');
    }

    function hideSuggestions() {
      searchSuggestionsDropdown.classList.add('hidden');
      activeSuggestionIdx = -1;
      currentSuggestions = [];
    }

    function highlightSuggestion(idx) {
      const items = suggestionsList.querySelectorAll('.suggestion-item');
      items.forEach((el, i) => {
        if (i === idx) {
          el.classList.add('bg-zinc-100', 'dark:bg-zinc-800/90');
          el.scrollIntoView({ block: 'nearest' });
        } else {
          el.classList.remove('bg-zinc-100', 'dark:bg-zinc-800/90');
        }
      });
    }

    function executeSearch(query) {
      const q = query.trim();
      if (!q) return;
      const isUrl = /^(https?:\/\/)?(localhost|(\d{1,3}\.){3}\d{1,3}|([a-z0-9-]+\.)+[a-z]{2,}|[a-z0-9-]+:\d+)(:\d+)?(\/.*)?$/i.test(q);
      if (isUrl) {
        let dest = q;
        if (!/^https?:\/\//i.test(dest)) {
          if (/^(localhost|(\d{1,3}\.){3}\d{1,3}|[a-z0-9-]+:\d+)/i.test(dest)) {
            dest = `http://${dest}`;
          } else {
            dest = `https://${dest}`;
          }
        }
        window.location.href = dest;
        return;
      }
      const engine = SEARCH_ENGINES[state.searchEngineIndex];
      window.location.href = engine.url + encodeURIComponent(q);
    }

    function applySearchEngine(idx) {
      state.searchEngineIndex = idx % SEARCH_ENGINES.length;
      localStorage.setItem('newtab_engine_idx', state.searchEngineIndex);
      const engine = SEARCH_ENGINES[state.searchEngineIndex];
      engineIconContainer.innerHTML = `<img src="https://www.google.com/s2/favicons?domain=${engine.domain}&sz=64" alt="${engine.name}" class="w-3.5 h-3.5 rounded object-contain" />`;
      engineName.textContent = engine.name;
      searchInput.placeholder = `Search with ${engine.name} or type a URL...`;
    }

    function cycleSearchEngine() {
      applySearchEngine(state.searchEngineIndex + 1);
    }

    btnEnginePill.addEventListener('click', cycleSearchEngine);

    let suggestDebounce = null;
    searchInput.addEventListener('input', () => {
      btnClearSearch.classList.toggle('hidden', searchInput.value.length === 0);
      clearTimeout(suggestDebounce);
      suggestDebounce = setTimeout(() => {
        fetchSearchSuggestions(searchInput.value);
      }, 100);
      const val = searchInput.value;
      if (val.startsWith('g ')) {
        applySearchEngine(0);
        searchInput.value = val.slice(2);
      } else if (val.startsWith('p ')) {
        applySearchEngine(1);
        searchInput.value = val.slice(2);
      } else if (val.startsWith('d ') || val.startsWith('ddg ')) {
        applySearchEngine(2);
        searchInput.value = val.replace(/^(d|ddg)\s/, '');
      } else if (val.startsWith('gh ')) {
        applySearchEngine(3);
        searchInput.value = val.slice(3);
      } else if (val.startsWith('yt ')) {
        applySearchEngine(4);
        searchInput.value = val.slice(3);
      }
    });

    searchInput.addEventListener('keydown', (e) => {
      if (e.key === 'Tab' && !e.shiftKey) {
        e.preventDefault();
        cycleSearchEngine();
        return;
      }
      if (e.key === 'Escape') {
        hideSuggestions();
        searchInput.value = '';
        btnClearSearch.classList.add('hidden');
        searchInput.blur();
        return;
      }
      if (!searchSuggestionsDropdown.classList.contains('hidden') && currentSuggestions.length > 0) {
        if (e.key === 'ArrowDown') {
          e.preventDefault();
          activeSuggestionIdx = (activeSuggestionIdx + 1) % currentSuggestions.length;
          highlightSuggestion(activeSuggestionIdx);
          searchInput.value = currentSuggestions[activeSuggestionIdx];
          return;
        } else if (e.key === 'ArrowUp') {
          e.preventDefault();
          activeSuggestionIdx = (activeSuggestionIdx - 1 + currentSuggestions.length) % currentSuggestions.length;
          highlightSuggestion(activeSuggestionIdx);
          searchInput.value = currentSuggestions[activeSuggestionIdx];
          return;
        }
      }
    });

    document.addEventListener('click', (e) => {
      if (!searchForm.contains(e.target) && !searchSuggestionsDropdown.contains(e.target)) {
        hideSuggestions();
      }
    });

    btnClearSearch.addEventListener('click', () => {
      searchInput.value = '';
      btnClearSearch.classList.add('hidden');
      searchInput.focus();
    });

    searchForm.addEventListener('submit', (e) => {
      e.preventDefault();
      hideSuggestions();
      executeSearch(searchInput.value);
    });

    function renderShortcuts() {
      shortcutsGrid.innerHTML = '';
      state.shortcuts.forEach((item) => {
        const tile = document.createElement('div');
        tile.className = 'group relative flex flex-col items-center justify-center p-3 rounded-2xl liquid-glass tile-hover shadow-sm cursor-pointer select-none';
        
        const domain = getDomain(item.url);
        const iconSrc = `https://www.google.com/s2/favicons?domain=${domain}&sz=64`;
        const initial = (item.name || 'S').charAt(0).toUpperCase();

        tile.innerHTML = `
          <button type="button" data-edit-id="${item.id}" class="btn-edit-shortcut absolute top-1.5 left-1.5 opacity-0 group-hover:opacity-100 transition-opacity duration-150 w-5 h-5 rounded-full bg-zinc-200/90 dark:bg-zinc-800/90 hover:bg-sky-500 hover:text-white text-zinc-500 dark:text-zinc-400 flex items-center justify-center shadow-sm z-20" title="Edit ${item.name}">
            <svg class="w-2.5 h-2.5 pointer-events-none" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"/></svg>
          </button>
          <button type="button" data-delete-id="${item.id}" class="btn-del-shortcut absolute top-1.5 right-1.5 opacity-0 group-hover:opacity-100 transition-opacity duration-150 w-5 h-5 rounded-full bg-zinc-200/90 dark:bg-zinc-800/90 hover:bg-red-500 hover:text-white text-zinc-500 dark:text-zinc-400 flex items-center justify-center shadow-sm z-20" title="Remove ${item.name}">
            <svg class="w-3 h-3 pointer-events-none" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/></svg>
          </button>
          <div class="w-10 h-10 rounded-xl bg-white/30 dark:bg-black/25 flex items-center justify-center mb-1.5 shadow-sm border border-white/30 dark:border-white/10 group-hover:scale-105 transition">
            <img src="${iconSrc}" 
                 alt="${item.name}" 
                 loading="lazy" 
                 class="w-6 h-6 rounded object-contain" 
                 onerror="if(!this.dataset.triedDd){this.dataset.triedDd='1';this.src='https://icons.duckduckgo.com/ip3/${domain}.ico';}else{this.onerror=null;this.parentElement.innerHTML='<span class=\'text-sm font-semibold text-zinc-800 dark:text-zinc-100\'>${initial}</span>';}" />
          </div>
          <span class="text-xs font-semibold text-zinc-800 dark:text-zinc-100 truncate max-w-[72px] drop-shadow-sm">${item.name}</span>
        `;

        tile.addEventListener('click', (e) => {
          if (e.target.closest('.btn-del-shortcut') || e.target.closest('.btn-edit-shortcut')) return;
          window.location.href = item.url;
        });

        shortcutsGrid.appendChild(tile);
      });

      const addTile = document.createElement('button');
      addTile.type = 'button';
      addTile.className = 'flex flex-col items-center justify-center p-3 rounded-2xl liquid-glass tile-hover border-dashed text-zinc-400 hover:text-zinc-700 dark:hover:text-zinc-200 transition group';
      addTile.innerHTML = `
        <div class="w-10 h-10 rounded-xl bg-transparent flex items-center justify-center mb-1.5 text-zinc-400 group-hover:text-zinc-600 dark:group-hover:text-zinc-200 transition">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"/></svg>
        </div>
        <span class="text-xs font-semibold text-zinc-700 dark:text-zinc-200 truncate">Add</span>
      `;
      addTile.addEventListener('click', openAddShortcutModal);
      shortcutsGrid.appendChild(addTile);

      document.querySelectorAll('.btn-edit-shortcut').forEach(btn => {
        btn.addEventListener('click', (e) => {
          e.stopPropagation();
          const id = btn.getAttribute('data-edit-id');
          openEditShortcutModal(id);
        });
      });

      document.querySelectorAll('.btn-del-shortcut').forEach(btn => {
        btn.addEventListener('click', (e) => {
          e.stopPropagation();
          const id = btn.getAttribute('data-delete-id');
          state.shortcuts = state.shortcuts.filter(s => s.id !== id);
          localStorage.setItem('newtab_shortcuts', JSON.stringify(state.shortcuts));
          renderShortcuts();
        });
      });
    }

    function openAddShortcutModal() {
      editingShortcutId = null;
      shortcutModalTitle.textContent = 'Add Shortcut';
      shortcutNameInput.value = '';
      shortcutUrlInput.value = '';
      shortcutModal.classList.add('is-open');
      shortcutNameInput.focus();
    }

    function openEditShortcutModal(id) {
      const item = state.shortcuts.find(s => s.id === id);
      if (!item) return;
      editingShortcutId = id;
      shortcutModalTitle.textContent = 'Edit Shortcut';
      shortcutNameInput.value = item.name;
      shortcutUrlInput.value = item.url;
      shortcutModal.classList.add('is-open');
      shortcutNameInput.focus();
    }

    function closeShortcutModal() {
      shortcutModal.classList.remove('is-open');
      editingShortcutId = null;
    }

    btnSaveShortcut.addEventListener('click', () => {
      const name = shortcutNameInput.value.trim();
      let url = shortcutUrlInput.value.trim();
      if (!name || !url) return;
      if (!/^(https?:\/\/)/i.test(url)) {
        if (/^(localhost|(\d{1,3}\.){3}\d{1,3}|[a-z0-9-]+:\d+)/i.test(url)) {
          url = 'http://' + url;
        } else {
          url = 'https://' + url;
        }
      }
      if (editingShortcutId) {
        state.shortcuts = state.shortcuts.map(s => {
          if (s.id === editingShortcutId) {
            return { ...s, name: name, url: url };
          }
          return s;
        });
      } else {
        const newShortcut = {
          id: 's_' + Date.now(),
          name: name,
          url: url
        };
        state.shortcuts.push(newShortcut);
      }
      localStorage.setItem('newtab_shortcuts', JSON.stringify(state.shortcuts));
      renderShortcuts();
      closeShortcutModal();
    });

    btnCancelShortcut.addEventListener('click', closeShortcutModal);
    btnCloseShortcutModal.addEventListener('click', closeShortcutModal);

    const WMO_CODES = {
      0: { text: 'Clear Sky', icon: 'sun' },
      1: { text: 'Mainly Clear', icon: 'sun' },
      2: { text: 'Partly Cloudy', icon: 'cloud-sun' },
      3: { text: 'Overcast', icon: 'cloud' },
      45: { text: 'Foggy', icon: 'cloud' },
      48: { text: 'Rime Fog', icon: 'cloud' },
      51: { text: 'Light Drizzle', icon: 'rain' },
      53: { text: 'Drizzle', icon: 'rain' },
      55: { text: 'Heavy Drizzle', icon: 'rain' },
      61: { text: 'Light Rain', icon: 'rain' },
      63: { text: 'Moderate Rain', icon: 'rain' },
      65: { text: 'Heavy Rain', icon: 'rain' },
      71: { text: 'Light Snow', icon: 'snow' },
      73: { text: 'Snow', icon: 'snow' },
      75: { text: 'Heavy Snow', icon: 'snow' },
      80: { text: 'Rain Showers', icon: 'rain' },
      81: { text: 'Showers', icon: 'rain' },
      82: { text: 'Violent Rain', icon: 'rain' },
      95: { text: 'Thunderstorm', icon: 'thunder' }
    };

    function getWeatherSvg(type) {
      if (type === 'sun') {
        return '<svg class="w-8 h-8 text-amber-500" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"/></svg>';
      } else if (type === 'rain') {
        return '<svg class="w-8 h-8 text-blue-400" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M20 16.58A5 5 0 0018 7h-1.26A8 8 0 104 15.25M8 19v2m4-2v2m4-2v2"/></svg>';
      } else if (type === 'cloud-sun') {
        return '<svg class="w-8 h-8 text-sky-400" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 3v2m6.364 1.636l-1.414 1.414M21 12h-2M4.222 4.222l1.414 1.414M3 12h2m13 4a4 4 0 01-8 0 4.5 4.5 0 01.32-1.68A6 6 0 1118 16z"/></svg>';
      } else if (type === 'thunder') {
        return '<svg class="w-8 h-8 text-yellow-400" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M13 10V3L4 14h7v7l9-11h-7z"/></svg>';
      }
      return '<svg class="w-8 h-8 text-zinc-400" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M3 15a4 4 0 004 4h9a5 5 0 10-.1-9.999 5.002 5.002 0 00-9.78 2.096A4.001 4.001 0 003 15z"/></svg>';
    }

    async function fetchWeather(lat, lon, cityName) {
      weatherLocationLabel.textContent = cityName || 'Updating...';
      try {
        const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,relative_humidity_2m,weather_code&daily=temperature_2m_max,temperature_2m_min&timezone=auto`;
        const res = await fetch(url);
        if (!res.ok) throw new Error('Weather fetch error');
        const data = await res.json();
        state.weatherData = data;
        state.weatherLat = lat;
        state.weatherLon = lon;
        state.weatherCity = cityName;
        localStorage.setItem('newtab_weather_cache', JSON.stringify(data));
        localStorage.setItem('newtab_weather_lat', lat);
        localStorage.setItem('newtab_weather_lon', lon);
        localStorage.setItem('newtab_weather_city', cityName);
        renderWeatherData();
      } catch (err) {
        if (state.weatherData) {
          renderWeatherData();
        } else {
          weatherTemp.textContent = '24°';
          weatherCondition.textContent = 'Clear';
          weatherIconContainer.innerHTML = getWeatherSvg('sun');
          weatherRange.textContent = 'H: 28° L: 18°';
          weatherHumidity.textContent = 'Humidity: 60%';
          weatherLocationLabel.textContent = cityName || 'Local';
        }
      }
    }

    function renderWeatherData() {
      if (!state.weatherData || !state.weatherData.current) return;
      const cur = state.weatherData.current;
      const daily = state.weatherData.daily;
      const code = cur.weather_code || 0;
      const info = WMO_CODES[code] || { text: 'Clear', icon: 'sun' };
      weatherTemp.textContent = `${Math.round(cur.temperature_2m)}°`;
      weatherCondition.textContent = info.text;
      weatherIconContainer.innerHTML = getWeatherSvg(info.icon);
      weatherLocationLabel.textContent = state.weatherCity;
      if (daily && daily.temperature_2m_max && daily.temperature_2m_max.length > 0) {
        const max = Math.round(daily.temperature_2m_max[0]);
        const min = Math.round(daily.temperature_2m_min[0]);
        weatherRange.textContent = `H: ${max}° L: ${min}°`;
      }
      weatherHumidity.textContent = `Humidity: ${cur.relative_humidity_2m || 55}%`;
    }

    btnEditLocation.addEventListener('click', () => {
      cityModal.classList.add('is-open');
      citySearchInput.focus();
    });

    btnCloseCityModal.addEventListener('click', () => cityModal.classList.remove('is-open'));
    btnCancelCity.addEventListener('click', () => cityModal.classList.remove('is-open'));

    citySearchInput.addEventListener('input', async () => {
      const q = citySearchInput.value.trim();
      if (q.length < 2) {
        citySearchResults.innerHTML = '';
        return;
      }
      try {
        const geoUrl = `https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(q)}&count=5&language=en&format=json`;
        const res = await fetch(geoUrl);
        const data = await res.json();
        citySearchResults.innerHTML = '';
        if (data.results && data.results.length > 0) {
          data.results.forEach(loc => {
            const row = document.createElement('div');
            row.className = 'p-2 rounded-lg hover:bg-zinc-100 dark:hover:bg-zinc-800 cursor-pointer flex justify-between items-center text-xs transition';
            row.innerHTML = `
              <span class="font-medium text-zinc-900 dark:text-white font-medium">${loc.name}, <span class="text-zinc-400">${loc.country || ''}</span></span>
              <span class="text-[10px] font-mono text-zinc-400">${loc.latitude.toFixed(2)}, ${loc.longitude.toFixed(2)}</span>
            `;
            row.addEventListener('click', () => {
              cityModal.classList.remove('is-open');
              fetchWeather(loc.latitude, loc.longitude, loc.name);
            });
            citySearchResults.appendChild(row);
          });
        }
      } catch (e) {}
    });

    btnUseAutoGps.addEventListener('click', () => {
      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(
          (pos) => {
            cityModal.classList.remove('is-open');
            fetchWeather(pos.coords.latitude, pos.coords.longitude, 'My Location');
          },
          () => alert('Location permission denied. Please choose a city manually.')
        );
      }
    });

    function renderReadingList() {
      readingListContainer.innerHTML = '';
      if (state.readingList.length === 0) {
        readingListContainer.innerHTML = '<div class="text-zinc-400 dark:text-zinc-600 text-xs py-2 italic text-center">No saved reading links yet</div>';
        readingListCount.textContent = '0 items saved';
        return;
      }
      readingListCount.textContent = `${state.readingList.length} item${state.readingList.length === 1 ? '' : 's'} saved`;
      state.readingList.slice(0, 5).forEach((item) => {
        const row = document.createElement('div');
        row.className = 'group flex items-center justify-between p-1 rounded-lg hover:bg-zinc-50 dark:hover:bg-zinc-800/60 transition cursor-pointer text-xs';
        const host = getDomain(item.url);
        row.innerHTML = `
          <div class="flex items-center gap-2 truncate pr-2">
            <img src="${getFaviconUrl(item.url)}" alt="" class="w-3.5 h-3.5 rounded object-contain flex-shrink-0" onerror="this.style.display='none'" />
            <span class="text-zinc-800 dark:text-zinc-200 font-medium truncate">${item.title}</span>
            <span class="text-[10px] text-zinc-400 font-mono hidden sm:inline">• ${host}</span>
          </div>
          <button type="button" data-del-id="${item.id}" class="btn-del-reading opacity-0 group-hover:opacity-100 w-5 h-5 rounded-md hover:bg-red-500/10 text-zinc-400 hover:text-red-500 flex items-center justify-center transition" title="Remove">
            <svg class="w-3 h-3 pointer-events-none" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/></svg>
          </button>
        `;
        row.addEventListener('click', (e) => {
          if (e.target.closest('.btn-del-reading')) return;
          window.location.href = item.url;
        });
        readingListContainer.appendChild(row);
      });

      document.querySelectorAll('.btn-del-reading').forEach(btn => {
        btn.addEventListener('click', (e) => {
          e.stopPropagation();
          const id = btn.getAttribute('data-del-id');
          state.readingList = state.readingList.filter(r => r.id !== id);
          localStorage.setItem('newtab_reading_list', JSON.stringify(state.readingList));
          renderReadingList();
        });
      });
    }

    btnAddReadingLink.addEventListener('click', () => {
      readingTitleInput.value = '';
      readingUrlInput.value = '';
      readingModal.classList.add('is-open');
      readingTitleInput.focus();
    });

    btnCancelReading.addEventListener('click', () => readingModal.classList.remove('is-open'));
    btnCloseReadingModal.addEventListener('click', () => readingModal.classList.remove('is-open'));

    btnSaveReading.addEventListener('click', () => {
      const title = readingTitleInput.value.trim();
      let url = readingUrlInput.value.trim();
      if (!title || !url) return;
      if (!/^(https?:\/\/)/i.test(url)) url = 'https://' + url;
      state.readingList.unshift({
        id: 'r_' + Date.now(),
        title: title,
        url: url,
        date: Date.now()
      });
      localStorage.setItem('newtab_reading_list', JSON.stringify(state.readingList));
      renderReadingList();
      readingModal.classList.remove('is-open');
    });

    function evaluateMath(expr) {
      const cleaned = expr.trim();
      if (!/^[\d\s\+\-\*/\(\)\.\,\%\^]|(sqrt|abs|pi)+$/i.test(cleaned)) return null;
      let formatted = cleaned.replace(/\^/g, '**');
      formatted = formatted.replace(/\bsqrt\(([^)]+)\)/g, 'Math.sqrt($1)');
      formatted = formatted.replace(/\babs\(([^)]+)\)/g, 'Math.abs($1)');
      formatted = formatted.replace(/\bpi\b/g, 'Math.PI');
      try {
        const res = Function(`'use strict'; return (${formatted})`)();
        if (typeof res === 'number' && !isNaN(res) && isFinite(res)) {
          return Math.round(res * 100000) / 100000;
        }
      } catch (e) {}
      return null;
    }

    const COMMAND_ACTIONS = [
      { id: 'focus_zen', title: 'Toggle Zen Focus Mode', desc: 'Hide bottom widgets for deep focus', action: () => setFocusMode(!state.focusMode) },
      { id: 'toggle_theme', title: 'Toggle Light / Dark Theme', desc: 'Switch visual appearance', action: () => toggleTheme() },
      { id: 'add_shortcut', title: 'Add New Shortcut', desc: 'Add custom speed dial bookmark', action: () => openAddShortcutModal() },
      { id: 'add_reading', title: 'Add Link to Reading List', desc: 'Save a page for later', action: () => btnAddReadingLink.click() },
      { id: 'reset_all', title: 'Reset Defaults', desc: 'Restore default shortcuts & settings', action: () => {
        if (confirm('Reset new tab shortcuts and settings to defaults?')) {
          localStorage.clear();
          location.reload();
        }
      }}
    ];

    function openCommandPalette() {
      cmdModal.classList.add('is-open');
      cmdInput.value = '';
      cmdInput.focus();
      renderCommandList('');
    }

    function closeCommandPalette() {
      cmdModal.classList.remove('is-open');
    }

    function renderCommandList(query) {
      cmdList.innerHTML = '';
      const q = query.trim().toLowerCase();
      const mathResult = evaluateMath(q);
      if (mathResult !== null) {
        cmdCalcCard.classList.remove('hidden');
        cmdCalcVal.textContent = mathResult;
      } else {
        cmdCalcCard.classList.add('hidden');
      }
      const matches = COMMAND_ACTIONS.filter(c => c.title.toLowerCase().includes(q) || c.desc.toLowerCase().includes(q));
      state.shortcuts.forEach(s => {
        if (s.name.toLowerCase().includes(q) || s.url.toLowerCase().includes(q)) {
          matches.push({
            id: 'open_' + s.id,
            title: `Open ${s.name}`,
            desc: s.url,
            action: () => window.location.href = s.url
          });
        }
      });
      if (matches.length === 0 && !mathResult) {
        cmdList.innerHTML = `<div class="p-3 text-center text-zinc-400 text-xs">No matching actions. Press Enter to search web for "${query}"</div>`;
        return;
      }
      matches.forEach((item, i) => {
        const row = document.createElement('div');
        row.className = `p-2.5 rounded-xl hover:bg-zinc-100 dark:hover:bg-zinc-800 cursor-pointer flex items-center justify-between transition ${i === 0 ? 'bg-zinc-50 dark:bg-zinc-800/60' : ''}`;
        row.innerHTML = `
          <div>
            <div class="font-medium text-zinc-900 dark:text-white font-medium">${item.title}</div>
            <div class="text-[11px] text-zinc-400 font-normal">${item.desc}</div>
          </div>
          <svg class="w-3.5 h-3.5 text-zinc-400" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M14 5l7 7m0 0l-7 7m7-7H3"/></svg>
        `;
        row.addEventListener('click', () => {
          closeCommandPalette();
          item.action();
        });
        cmdList.appendChild(row);
      });
    }

    cmdInput.addEventListener('input', () => {
      renderCommandList(cmdInput.value);
    });

    cmdInput.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        closeCommandPalette();
      } else if (e.key === 'Enter') {
        const q = cmdInput.value.trim();
        const mathResult = evaluateMath(q);
        if (mathResult !== null) {
          navigator.clipboard.writeText(String(mathResult));
          closeCommandPalette();
          return;
        }
        const firstAction = cmdList.querySelector('div');
        if (firstAction && !firstAction.classList.contains('text-center')) {
          firstAction.click();
        } else if (q) {
          closeCommandPalette();
          const engine = SEARCH_ENGINES[state.searchEngineIndex];
          window.location.href = engine.url + encodeURIComponent(q);
        }
      }
    });

    cmdModal.addEventListener('click', (e) => {
      if (e.target === cmdModal) closeCommandPalette();
    });

    shortcutModal.addEventListener('click', (e) => {
      if (e.target === shortcutModal) closeShortcutModal();
    });

    readingModal.addEventListener('click', (e) => {
      if (e.target === readingModal) readingModal.classList.remove('is-open');
    });

    cityModal.addEventListener('click', (e) => {
      if (e.target === cityModal) cityModal.classList.remove('is-open');
    });

    window.addEventListener('keydown', (e) => {
      if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') {
        e.preventDefault();
        openCommandPalette();
        return;
      }
      const activeTag = document.activeElement ? document.activeElement.tagName.toLowerCase() : '';
      if (activeTag === 'input' || activeTag === 'textarea' || activeTag === 'select') return;
      if (e.key === '/') {
        e.preventDefault();
        searchInput.focus();
        return;
      }
      if (e.key >= '1' && e.key <= '8') {
        const idx = Number(e.key) - 1;
        if (state.shortcuts[idx]) {
          e.preventDefault();
          window.location.href = state.shortcuts[idx].url;
        }
      }
    });

    document.addEventListener('pointermove', (e) => {
      const glass = e.target.closest('.liquid-glass');
      if (!glass) return;
      const rect = glass.getBoundingClientRect();
      const x = e.clientX - rect.left;
      const y = e.clientY - rect.top;
      glass.style.setProperty('--mouse-x', `${x}px`);
      glass.style.setProperty('--mouse-y', `${y}px`);
    }, { passive: true });

    applyTheme(state.theme);
    setFocusMode(state.focusMode);
    applySearchEngine(state.searchEngineIndex);
    renderShortcuts();
    renderReadingList();

    async function autoDetectAccurateLocation() {
      fetchWeather(state.weatherLat, state.weatherLon, state.weatherCity);
      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(
          async (pos) => {
            const lat = pos.coords.latitude;
            const lon = pos.coords.longitude;
            try {
              const res = await fetch(`https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${lat}&longitude=${lon}&localityLanguage=en`);
              const geo = await res.json();
              const areaName = geo.locality || geo.city || geo.principalSubdivision || 'Local Area';
              fetchWeather(lat, lon, areaName);
            } catch (e) {
              fetchWeather(lat, lon, 'Local Area');
            }
          },
          async () => {
            if (!localStorage.getItem('newtab_weather_calibrated')) {
              try {
                const ipRes = await fetch('https://ipwho.is/');
                const ipData = await ipRes.json();
                if (ipData && ipData.latitude && ipData.longitude) {
                  localStorage.setItem('newtab_weather_calibrated', 'true');
                  fetchWeather(ipData.latitude, ipData.longitude, ipData.city || ipData.region);
                }
              } catch (e) {}
            }
          },
          { enableHighAccuracy: true, timeout: 6000 }
        );
      }
    }

    autoDetectAccurateLocation();
  </script>
</body>
</html>
